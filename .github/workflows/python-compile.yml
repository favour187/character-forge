name: Python compile check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: |
          python -m py_compile engine.py sculpt.py server.py ai.py db.py director.py sitecustomize.py
