name: Python compile check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: |
          # Compile every top-level module that exists. sitecustomize.py was
          # listed here but never present in the repo, which failed the job
          # with "[Errno 2] No such file or directory".
          files=$(ls *.py 2>/dev/null)
          echo "Compiling: $files"
          python -m py_compile $files
